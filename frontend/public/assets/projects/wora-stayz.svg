<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="woraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#woraBg)"/>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#0D9488" fill-opacity="0.3" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.5"/>
    <text x="80" y="21" fill="#99F6E4" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">HOSPITALITY</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Wora Stayz</text>
    <text x="0" y="130" fill="url(#tealGrad)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Boutique Accommodations &amp; Resort Portal</text>

    <text x="0" y="185" fill="#CCFBF1" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">Modern hospitality website showcasing boutique vacation stays, room suites,</text>
    <text x="0" y="215" fill="#CCFBF1" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">resort amenities, local guides, and direct guest reservation inquiries.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#134E4A" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Room Suites</text>

      <rect x="175" y="0" width="160" height="40" rx="8" fill="#134E4A" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.3"/>
      <text x="255" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Resort Amenities</text>

      <rect x="350" y="0" width="160" height="40" rx="8" fill="#134E4A" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.3"/>
      <text x="430" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Guest Inquiries</text>
    </g>
  </g>

  <!-- Right Visual: Resort Card & Booking Engine Interface -->
  <g transform="translate(740, 140)">
    <rect x="0" y="0" width="380" height="390" rx="16" fill="#134E4A" stroke="#0D9488" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="45" rx="16" fill="#115E59"/>
    <text x="20" y="28" fill="#CCFBF1" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">worastayz.inwora.com · Stays</text>

    <!-- Property Card 1 -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="340" height="140" rx="8" fill="#042F2E" stroke="#2DD4BF" stroke-width="1"/>
      <rect x="15" y="15" width="120" height="110" rx="6" fill="#0D9488" fill-opacity="0.4"/>
      <text x="150" y="42" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700">Seaview Luxury Villa</text>
      <text x="150" y="65" fill="#2DD4BF" font-family="'Montserrat', sans-serif" font-size="12">King Bed · Private Pool</text>
      <text x="150" y="88" fill="#F0FDFA" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800">₹4,500 <tspan font-size="11" font-weight="400" fill="#99F6E4">/ night</tspan></text>
      <rect x="150" y="100" width="100" height="25" rx="5" fill="#2DD4BF"/>
      <text x="200" y="117" fill="#042F2E" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Enquire Now</text>
    </g>

    <!-- Amenities Ribbon -->
    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="340" height="80" rx="8" fill="#042F2E" stroke="#115E59" stroke-width="1"/>
      <text x="15" y="28" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">INCLUDED AMENITIES</text>
      <text x="15" y="52" fill="#99F6E4" font-family="'Montserrat', sans-serif" font-size="11">✓ High-speed WiFi   ✓ Breakfast Included   ✓ Room Service</text>
    </g>

    <rect x="20" y="325" width="340" height="42" rx="8" fill="#2DD4BF"/>
    <text x="190" y="351" fill="#042F2E" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Explore All Accommodations</text>
  </g>
</svg>