<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="storeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#011812"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#storeBg)"/>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="90" y="21" fill="#34D399" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">VENDOR PORTAL</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="50" font-weight="800" letter-spacing="-1">Store Grocery Panel</text>
    <text x="0" y="130" fill="url(#emeraldGrad)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Vendor Store Management &amp; Inventory Hub</text>

    <text x="0" y="185" fill="#A7F3D0" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">Vendor-facing merchant portal enabling retail grocers to control shelf pricing,</text>
    <text x="0" y="215" fill="#A7F3D0" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">toggle real-time stock availability, and fulfill customer grocery orders.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#ECFDF5" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Price &amp; Stock Sync</text>

      <rect x="175" y="0" width="160" height="40" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
      <text x="255" y="25" fill="#ECFDF5" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Order Dispatch</text>

      <rect x="350" y="0" width="170" height="40" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
      <text x="435" y="25" fill="#ECFDF5" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Catalogue Controls</text>
    </g>
  </g>

  <!-- Right Visual: Store Inventory Toggle Dashboard -->
  <g transform="translate(730, 150)">
    <rect x="0" y="0" width="390" height="370" rx="16" fill="#064E3B" fill-opacity="0.6" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="45" rx="16" fill="#047857"/>
    <text x="20" y="28" fill="#ECFDF5" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">Daily Stock Availability</text>
    <rect x="290" y="10" width="85" height="24" rx="12" fill="#065F46"/>
    <text x="332" y="26" fill="#A7F3D0" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" text-anchor="middle">148 IN STOCK</text>

    <!-- Grocery Item Row 1 -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="350" height="60" rx="8" fill="#022C22" stroke="#059669" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="15" y="12" width="36" height="36" rx="6" fill="#059669" fill-opacity="0.3"/>
      <text x="65" y="28" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">Farm Fresh Apples (1kg)</text>
      <text x="65" y="44" fill="#34D399" font-family="'Montserrat', sans-serif" font-size="11">₹180 · Qty: 45 Available</text>
      <!-- Toggle button: ON -->
      <rect x="290" y="18" width="45" height="24" rx="12" fill="#10B981"/>
      <circle cx="323" cy="30" r="9" fill="#FFFFFF"/>
    </g>

    <!-- Grocery Item Row 2 -->
    <g transform="translate(20, 138)">
      <rect x="0" y="0" width="350" height="60" rx="8" fill="#022C22" stroke="#059669" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="15" y="12" width="36" height="36" rx="6" fill="#059669" fill-opacity="0.3"/>
      <text x="65" y="28" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">Organic Cow Milk (1L)</text>
      <text x="65" y="44" fill="#34D399" font-family="'Montserrat', sans-serif" font-size="11">₹68 · Qty: 80 Available</text>
      <rect x="290" y="18" width="45" height="24" rx="12" fill="#10B981"/>
      <circle cx="323" cy="30" r="9" fill="#FFFFFF"/>
    </g>

    <!-- Grocery Item Row 3 -->
    <g transform="translate(20, 211)">
      <rect x="0" y="0" width="350" height="60" rx="8" fill="#022C22" stroke="#059669" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="15" y="12" width="36" height="36" rx="6" fill="#059669" fill-opacity="0.3"/>
      <text x="65" y="28" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">Whole Wheat Flour (5kg)</text>
      <text x="65" y="44" fill="#F87171" font-family="'Montserrat', sans-serif" font-size="11">₹245 · Low Stock Alert</text>
      <rect x="290" y="18" width="45" height="24" rx="12" fill="#EF4444" fill-opacity="0.7"/>
      <circle cx="302" cy="30" r="9" fill="#FFFFFF"/>
    </g>

    <!-- Bottom summary status -->
    <rect x="20" y="295" width="350" height="48" rx="8" fill="#059669" fill-opacity="0.3"/>
    <text x="195" y="324" fill="#34D399" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Live Store Sync Active · storegrocery.inwora.com</text>
  </g>
</svg>