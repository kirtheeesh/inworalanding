<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="groceryWebBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#021C15"/>
    </linearGradient>
    <linearGradient id="storefrontGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#groceryWebBg)"/>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#10B981" fill-opacity="0.2" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
    <text x="90" y="21" fill="#34D399" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ONLINE STOREFRONT</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Grocery Website</text>
    <text x="0" y="130" fill="url(#storefrontGrad)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Full-Featured Online Grocery Store &amp; Checkout</text>

    <text x="0" y="185" fill="#D1FAE5" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">Customer-facing e-commerce web storefront with departmental catalogues,</text>
    <text x="0" y="215" fill="#D1FAE5" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">seasonal promotion carousels, dynamic search filters, and secure cart checkout.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#065F46" stroke="#34D399" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Web Catalogue</text>

      <rect x="175" y="0" width="160" height="40" rx="8" fill="#065F46" stroke="#34D399" stroke-width="1" stroke-opacity="0.3"/>
      <text x="255" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cart Checkout</text>

      <rect x="350" y="0" width="160" height="40" rx="8" fill="#065F46" stroke="#34D399" stroke-width="1" stroke-opacity="0.3"/>
      <text x="430" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Customer Profiles</text>
    </g>
  </g>

  <!-- Right Visual: Desktop Browser Storefront Window -->
  <g transform="translate(730, 140)">
    <rect x="0" y="0" width="390" height="380" rx="14" fill="#022C22" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="42" rx="14" fill="#064E3B"/>
    <circle cx="20" cy="21" r="5" fill="#EF4444"/>
    <circle cx="36" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="21" r="5" fill="#10B981"/>
    <text x="200" y="26" fill="#A7F3D0" font-family="'Montserrat', sans-serif" font-size="11" text-anchor="middle">grocery.inwora.com</text>

    <!-- Promo Banner Carousel -->
    <rect x="20" y="60" width="350" height="100" rx="8" fill="#047857"/>
    <text x="40" y="95" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800">Fresh Organic Harvest</text>
    <text x="40" y="118" fill="#FCD34D" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600">Up to 30% Off Daily Staples</text>

    <!-- Product Grid Preview -->
    <g transform="translate(20, 180)">
      <rect x="0" y="0" width="105" height="120" rx="6" fill="#064E3B" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700">Cold Pressed Oil</text>
      <text x="10" y="105" fill="#34D399" font-family="'Montserrat', sans-serif" font-size="9">₹210</text>

      <rect x="122" y="0" width="105" height="120" rx="6" fill="#064E3B" stroke="#059669" stroke-width="0.8"/>
      <text x="132" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700">Basmati Rice (5kg)</text>
      <text x="132" y="105" fill="#34D399" font-family="'Montserrat', sans-serif" font-size="9">₹420</text>

      <rect x="245" y="0" width="105" height="120" rx="6" fill="#064E3B" stroke="#059669" stroke-width="0.8"/>
      <text x="255" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700">Fresh Avocados</text>
      <text x="255" y="105" fill="#34D399" font-family="'Montserrat', sans-serif" font-size="9">₹160</text>
    </g>

    <rect x="20" y="320" width="350" height="38" rx="6" fill="#10B981"/>
    <text x="195" y="344" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" text-anchor="middle">View Full Grocery Superstore →</text>
  </g>
</svg>