<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="wallmarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#wallmarkBg)"/>

  <!-- Architectural Façade Truss & Grid -->
  <g stroke="#64748B" stroke-width="0.75" stroke-opacity="0.15">
    <line x1="800" y1="50" x2="1150" y2="50"/>
    <line x1="800" y1="170" x2="1150" y2="170"/>
    <line x1="800" y1="290" x2="1150" y2="290"/>
    <line x1="800" y1="410" x2="1150" y2="410"/>
    <line x1="800" y1="530" x2="1150" y2="530"/>
    <!-- Diagonals -->
    <line x1="800" y1="50" x2="900" y2="170"/>
    <line x1="900" y1="170" x2="1000" y2="50"/>
    <line x1="1000" y1="50" x2="1100" y2="170"/>
    <line x1="800" y1="170" x2="900" y2="290"/>
    <line x1="900" y1="290" x2="1000" y2="170"/>
    <line x1="1000" y1="170" x2="1100" y2="290"/>
  </g>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#D97706" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1" stroke-opacity="0.4"/>
    <text x="90" y="21" fill="#FBBF24" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">FAÇADE ENGINEERING</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Wallmark Facades</text>
    <text x="0" y="130" fill="url(#bronzeGrad)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Curtain Walls, Cladding &amp; Structural Steel</text>

    <text x="0" y="185" fill="#CBD5E1" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400">Architectural engineering brand website showcasing curtain wall fabrication,</text>
    <text x="0" y="215" fill="#CBD5E1" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400">commercial exterior glazing, and structural steel installations across Tamil Nadu.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Curtain Walls</text>

      <rect x="175" y="0" width="160" height="40" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1" stroke-opacity="0.3"/>
      <text x="255" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Structural Glazing</text>

      <rect x="350" y="0" width="170" height="40" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1" stroke-opacity="0.3"/>
      <text x="435" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Engineering Specs</text>
    </g>
  </g>

  <!-- Right Visual: Curtain Wall Glazing Showcase -->
  <g transform="translate(760, 150)">
    <rect x="0" y="0" width="360" height="370" rx="16" fill="#1E293B" fill-opacity="0.8" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="45" rx="16" fill="#334155"/>
    <text x="20" y="28" fill="#F8FAFC" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">wallmarkfacades.com · Chennai</text>

    <!-- Glazing Units Grid Preview -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="150" height="135" rx="6" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="75" y="72" fill="#E0F2FE" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Unitized Glass</text>

      <rect x="170" y="0" width="150" height="135" rx="6" fill="#D97706" fill-opacity="0.25" stroke="#FBBF24" stroke-width="1.5"/>
      <text x="245" y="72" fill="#FEF3C7" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Panel Cladding</text>

      <rect x="0" y="150" width="320" height="85" rx="6" fill="#334155" stroke="#64748B" stroke-width="1"/>
      <text x="20" y="185" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">Pre-Engineered Steel Structures</text>
      <text x="20" y="208" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="11">Industrial Fabrication · On-Site Installation</text>
    </g>
  </g>
</svg>