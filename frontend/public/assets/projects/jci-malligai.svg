<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="jciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D54"/>
      <stop offset="50%" stop-color="#001830"/>
      <stop offset="100%" stop-color="#000D1A"/>
    </linearGradient>
    <linearGradient id="jciBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0097D7"/>
      <stop offset="100%" stop-color="#70D6FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#jciBg)"/>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#0097D7" fill-opacity="0.2" stroke="#0097D7" stroke-width="1" stroke-opacity="0.4"/>
    <text x="85" y="21" fill="#70D6FF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">MEMBER PORTAL</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">JCI Malligai</text>
    <text x="0" y="130" fill="url(#jciBlue)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Member Directory &amp; Organization Operations</text>

    <text x="0" y="185" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400">Dedicated operational management platform for civic leadership chapters,</text>
    <text x="0" y="215" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400">managing member records, event workflows, and administrative audits.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="170" height="40" rx="8" fill="#001F3F" stroke="#0097D7" stroke-width="1" stroke-opacity="0.3"/>
      <text x="85" y="25" fill="#E0F2FE" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Member Directory</text>

      <rect x="185" y="0" width="170" height="40" rx="8" fill="#001F3F" stroke="#0097D7" stroke-width="1" stroke-opacity="0.3"/>
      <text x="270" y="25" fill="#E0F2FE" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Event Workflows</text>

      <rect x="370" y="0" width="170" height="40" rx="8" fill="#001F3F" stroke="#0097D7" stroke-width="1" stroke-opacity="0.3"/>
      <text x="455" y="25" fill="#E0F2FE" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Chapter Reports</text>
    </g>
  </g>

  <!-- Right Visual: Member Badge & Network Hub -->
  <g transform="translate(750, 160)">
    <rect x="0" y="0" width="370" height="360" rx="16" fill="#001830" stroke="#0097D7" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="370" height="45" rx="16" fill="#002D54"/>
    <text x="185" y="28" fill="#E0F2FE" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Executive Committee Board</text>

    <!-- Member Profile Item 1 -->
    <g transform="translate(25, 70)">
      <rect x="0" y="0" width="320" height="70" rx="8" fill="#002244" stroke="#0097D7" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="35" cy="35" r="20" fill="#0097D7" fill-opacity="0.3"/>
      <text x="35" y="41" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CP</text>
      <text x="70" y="32" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700">Chapter President</text>
      <text x="70" y="50" fill="#70D6FF" font-family="'Montserrat', sans-serif" font-size="11">Active Tenure · Governing Council</text>
      <circle cx="295" cy="35" r="5" fill="#10B981"/>
    </g>

    <!-- Member Profile Item 2 -->
    <g transform="translate(25, 155)">
      <rect x="0" y="0" width="320" height="70" rx="8" fill="#002244" stroke="#0097D7" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="35" cy="35" r="20" fill="#0097D7" fill-opacity="0.3"/>
      <text x="35" y="41" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" text-anchor="middle">VP</text>
      <text x="70" y="32" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700">Vice President · Projects</text>
      <text x="70" y="50" fill="#70D6FF" font-family="'Montserrat', sans-serif" font-size="11">Community Action Portfolio</text>
      <circle cx="295" cy="35" r="5" fill="#10B981"/>
    </g>

    <!-- Member Profile Item 3 -->
    <g transform="translate(25, 240)">
      <rect x="0" y="0" width="320" height="70" rx="8" fill="#002244" stroke="#0097D7" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="35" cy="35" r="20" fill="#0097D7" fill-opacity="0.3"/>
      <text x="35" y="41" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SEC</text>
      <text x="70" y="32" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700">Secretary General</text>
      <text x="70" y="50" fill="#70D6FF" font-family="'Montserrat', sans-serif" font-size="11">Records, Dues &amp; Meeting Logs</text>
      <circle cx="295" cy="35" r="5" fill="#10B981"/>
    </g>
  </g>
</svg>