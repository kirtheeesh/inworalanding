<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="apiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#apiBg)"/>

  <!-- Terminal Grid Accents -->
  <g stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#0891B2" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
    <text x="80" y="21" fill="#22D3EE" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">RESTful BACKEND</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Grocery API</text>
    <text x="0" y="130" fill="url(#codeGrad)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Commerce Core API Services &amp; Synchronization</text>

    <text x="0" y="185" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400">Scalable REST API infrastructure interconnecting customer shopping apps, store</text>
    <text x="0" y="215" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400">vendor consoles, catalogue synchronization, and real-time order states.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#E2E8F0" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">OAuth &amp; JWT Auth</text>

      <rect x="175" y="0" width="170" height="40" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>
      <text x="260" y="25" fill="#E2E8F0" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Catalogue Endpoints</text>

      <rect x="360" y="0" width="170" height="40" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>
      <text x="445" y="25" fill="#E2E8F0" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Order Webhooks</text>
    </g>
  </g>

  <!-- Right Visual: Developer API Console & JSON Payload -->
  <g transform="translate(730, 140)">
    <rect x="0" y="0" width="400" height="390" rx="16" fill="#030712" stroke="#1E293B" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="40" rx="16" fill="#0F172A"/>
    <circle cx="20" cy="20" r="5" fill="#EF4444"/>
    <circle cx="36" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="20" r="5" fill="#10B981"/>
    <text x="200" y="25" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">groceryapi.inwora.com/v1</text>

    <!-- Code Block / Endpoints -->
    <g transform="translate(25, 60)" font-family="monospace" font-size="12">
      <!-- Endpoint 1 -->
      <rect x="0" y="0" width="48" height="22" rx="4" fill="#0284C7"/>
      <text x="24" y="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">GET</text>
      <text x="58" y="15" fill="#E2E8F0">/api/v1/catalog/products</text>
      <text x="310" y="15" fill="#10B981">200 OK</text>

      <!-- Endpoint 2 -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="55" height="22" rx="4" fill="#10B981"/>
        <text x="27" y="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">POST</text>
        <text x="65" y="15" fill="#E2E8F0">/api/v1/orders/create</text>
        <text x="310" y="15" fill="#10B981">201 OK</text>
      </g>

      <!-- JSON Payload Viewer -->
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="350" height="200" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="15" y="25" fill="#64748B">// Response Payload (application/json)</text>
        <text x="15" y="48" fill="#F8FAFC">{</text>
        <text x="30" y="70" fill="#38BDF8">"status": <tspan fill="#34D399">"success"</tspan>,</text>
        <text x="30" y="92" fill="#38BDF8">"order_id": <tspan fill="#F59E0B">"GR-89240"</tspan>,</text>
        <text x="30" y="114" fill="#38BDF8">"items_count": <tspan fill="#F43F5E">6</tspan>,</text>
        <text x="30" y="136" fill="#38BDF8">"fulfillment": <tspan fill="#34D399">"express_delivery"</tspan>,</text>
        <text x="30" y="158" fill="#38BDF8">"store_id": <tspan fill="#F59E0B">"STR-CHENNAI-01"</tspan></text>
        <text x="15" y="180" fill="#F8FAFC">}</text>
      </g>
    </g>
  </g>
</svg>