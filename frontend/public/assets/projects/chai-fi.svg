<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="chaiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="50%" stop-color="#2D0F04"/>
      <stop offset="100%" stop-color="#140602"/>
    </linearGradient>
    <linearGradient id="chaiAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#chaiBg)"/>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#FF6B4A" fill-opacity="0.2" stroke="#FF6B4A" stroke-width="1" stroke-opacity="0.4"/>
    <text x="85" y="21" fill="#FF8A65" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CAFÉ &amp; BEVERAGE</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="54" font-weight="800" letter-spacing="-1">Chai Fi</text>
    <text x="0" y="130" fill="url(#chaiAccent)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Modern Tea Café &amp; Counter Billing Solution</text>

    <text x="0" y="185" fill="#FED7AA" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">Contemporary tea café brand platform combining visual brand storytelling</text>
    <text x="0" y="215" fill="#FED7AA" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">with modern point-of-sale billing and ingredient inventory management.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#2D0F04" stroke="#FF6B4A" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Café Menu</text>

      <rect x="175" y="0" width="160" height="40" rx="8" fill="#2D0F04" stroke="#FF6B4A" stroke-width="1" stroke-opacity="0.3"/>
      <text x="255" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Counter POS</text>

      <rect x="350" y="0" width="160" height="40" rx="8" fill="#2D0F04" stroke="#FF6B4A" stroke-width="1" stroke-opacity="0.3"/>
      <text x="430" y="25" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Mobile PWA</text>
    </g>
  </g>

  <!-- Right Visual: Steaming Tea Cup & Modern POS Display -->
  <g transform="translate(750, 150)">
    <rect x="0" y="0" width="370" height="370" rx="16" fill="#2D0F04" stroke="#FF6B4A" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="370" height="45" rx="16" fill="#431407"/>
    <text x="20" y="28" fill="#FFF7ED" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">chaifi.inwora.com · Modern POS</text>

    <!-- Tea Cup Art -->
    <g transform="translate(185, 170)">
      <!-- Steam Lines -->
      <path d="M-20 -50 Q-10 -70 -20 -90" fill="none" stroke="#FF8A65" stroke-width="2.5" opacity="0.6"/>
      <path d="M0 -55 Q10 -75 0 -95" fill="none" stroke="#FF8A65" stroke-width="2.5" opacity="0.8"/>
      <path d="M20 -50 Q30 -70 20 -90" fill="none" stroke="#FF8A65" stroke-width="2.5" opacity="0.6"/>

      <!-- Cup Body -->
      <path d="M-60 -30 L60 -30 L45 45 L-45 45 Z" fill="#FF6B4A"/>
      <!-- Handle -->
      <path d="M60 -15 C85 -15 85 25 50 30" fill="none" stroke="#FF6B4A" stroke-width="6"/>
      <!-- Saucer -->
      <ellipse cx="0" cy="52" rx="75" ry="10" fill="#9A3412"/>
    </g>

    <!-- Quick Counter Stat -->
    <g transform="translate(30, 260)">
      <rect x="0" y="0" width="310" height="75" rx="8" fill="#140602" stroke="#7C2D12" stroke-width="1"/>
      <text x="15" y="32" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700">Fast Chai &amp; Snack Billing</text>
      <text x="15" y="55" fill="#FED7AA" font-family="'Montserrat', sans-serif" font-size="12">Thermal KOT, recipe inventory &amp; UPI QR</text>
    </g>
  </g>
</svg>