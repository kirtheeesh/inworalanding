<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="takeawayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="50%" stop-color="#270A03"/>
      <stop offset="100%" stop-color="#140502"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#takeawayBg)"/>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#EA580C" fill-opacity="0.2" stroke="#F97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="85" y="21" fill="#FB923C" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">FOOD ORDERING</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="54" font-weight="800" letter-spacing="-1">Takeaway</text>
    <text x="0" y="130" fill="url(#orangeGrad)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Online Food Ordering &amp; Meal Pickup Platform</text>

    <text x="0" y="185" fill="#FFEDD5" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">Interactive takeaway ordering portal featuring digital dish menus, item</text>
    <text x="0" y="215" fill="#FFEDD5" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">customization, instant cart placement, and order pickup tracking.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#270A03" stroke="#EA580C" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#FFF7ED" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Digital Menu</text>

      <rect x="175" y="0" width="160" height="40" rx="8" fill="#270A03" stroke="#EA580C" stroke-width="1" stroke-opacity="0.3"/>
      <text x="255" y="25" fill="#FFF7ED" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cart Checkout</text>

      <rect x="350" y="0" width="170" height="40" rx="8" fill="#270A03" stroke="#EA580C" stroke-width="1" stroke-opacity="0.3"/>
      <text x="435" y="25" fill="#FFF7ED" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Order Tracking</text>
    </g>
  </g>

  <!-- Right Visual: Takeaway Menu Card & Bag Visualizer -->
  <g transform="translate(750, 150)">
    <rect x="0" y="0" width="370" height="370" rx="16" fill="#270A03" stroke="#EA580C" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="370" height="45" rx="16" fill="#431407"/>
    <text x="20" y="28" fill="#FFF7ED" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">takeaway.inwora.com · Quick Pickup</text>

    <!-- Dish Item 1 -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="330" height="75" rx="8" fill="#1C0602" stroke="#7C2D12" stroke-width="1"/>
      <circle cx="38" cy="38" r="22" fill="#EA580C" fill-opacity="0.3"/>
      <text x="75" y="32" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">Special Tandoori Platter</text>
      <text x="75" y="52" fill="#FB923C" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600">₹320 · Ready in 15 mins</text>
      <rect x="250" y="22" width="65" height="30" rx="6" fill="#EA580C"/>
      <text x="282" y="41" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ ADD</text>
    </g>

    <!-- Dish Item 2 -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="330" height="75" rx="8" fill="#1C0602" stroke="#7C2D12" stroke-width="1"/>
      <circle cx="38" cy="38" r="22" fill="#EA580C" fill-opacity="0.3"/>
      <text x="75" y="32" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">Dum Biryani Family Pack</text>
      <text x="75" y="52" fill="#FB923C" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600">₹450 · Chef Special</text>
      <rect x="250" y="22" width="65" height="30" rx="6" fill="#EA580C"/>
      <text x="282" y="41" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ ADD</text>
    </g>

    <!-- Bottom Pickup Callout -->
    <g transform="translate(20, 250)">
      <rect x="0" y="0" width="330" height="85" rx="10" fill="#EA580C"/>
      <text x="20" y="32" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800">Order Ready for Counter Pickup</text>
      <text x="20" y="55" fill="#FFEDD5" font-family="'Montserrat', sans-serif" font-size="12">Live SMS &amp; screen notifications for diners</text>
    </g>
  </g>
</svg>