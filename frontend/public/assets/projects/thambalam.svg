<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="thambalamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0519"/>
      <stop offset="50%" stop-color="#2D020D"/>
      <stop offset="100%" stop-color="#140106"/>
    </linearGradient>
    <linearGradient id="zariGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#thambalamBg)"/>

  <!-- Ornate Border Patterns -->
  <rect x="35" y="35" width="1130" height="605" rx="16" fill="none" stroke="url(#zariGold)" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="45" y="45" width="1110" height="585" rx="12" fill="none" stroke="url(#zariGold)" stroke-width="0.8" stroke-opacity="0.2"/>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="190" height="32" rx="16" fill="#831843" fill-opacity="0.4" stroke="url(#zariGold)" stroke-width="1" stroke-opacity="0.5"/>
    <text x="95" y="21" fill="#FEF08A" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">WEDDING DESIGN</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Thambalam Bags</text>
    <text x="0" y="130" fill="url(#zariGold)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Handcrafted Wedding Bags &amp; Zari Gifting</text>

    <text x="0" y="185" fill="#FECDD3" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">Traditional wedding thambalam bag platform showcasing personalized zari</text>
    <text x="0" y="215" fill="#FECDD3" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">embroidery, couple names, and direct WhatsApp inquiry for marriage celebrations.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#4C0519" stroke="url(#zariGold)" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#FFF1F2" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Zari Embroidery</text>

      <rect x="175" y="0" width="160" height="40" rx="8" fill="#4C0519" stroke="url(#zariGold)" stroke-width="1" stroke-opacity="0.3"/>
      <text x="255" y="25" fill="#FFF1F2" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Name Printing</text>

      <rect x="350" y="0" width="170" height="40" rx="8" fill="#4C0519" stroke="url(#zariGold)" stroke-width="1" stroke-opacity="0.3"/>
      <text x="435" y="25" fill="#FFF1F2" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Custom Bulk Orders</text>
    </g>
  </g>

  <!-- Right Visual: Handcrafted Traditional Bag Motif -->
  <g transform="translate(760, 160)">
    <rect x="0" y="0" width="360" height="360" rx="16" fill="#2D020D" stroke="url(#zariGold)" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Bag Illustration -->
    <g transform="translate(60, 50)">
      <!-- Handle -->
      <path d="M70 70 C70 10, 170 10, 170 70" fill="none" stroke="url(#zariGold)" stroke-width="8" stroke-linecap="round"/>
      <!-- Bag Body -->
      <path d="M30 70 L210 70 L195 240 L45 240 Z" fill="#881337" stroke="url(#zariGold)" stroke-width="2.5"/>

      <!-- Zari Border on Bag -->
      <line x1="33" y1="90" x2="207" y2="90" stroke="url(#zariGold)" stroke-width="4"/>
      <line x1="42" y1="210" x2="198" y2="210" stroke="url(#zariGold)" stroke-width="4"/>

      <!-- Center Ornate Motif -->
      <circle cx="120" cy="150" r="32" fill="#4C0519" stroke="url(#zariGold)" stroke-width="2"/>
      <text x="120" y="157" fill="#FDE047" font-family="serif" font-size="18" font-weight="700" text-anchor="middle">தாம்பாளம்</text>
    </g>

    <text x="180" y="325" fill="#FDE047" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" text-anchor="middle">thambalam.inwora.com · Custom Handcraft</text>
  </g>
</svg>