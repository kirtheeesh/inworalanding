<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#adminBg)"/>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="85" y="21" fill="#38BDF8" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ADMIN CONSOLE</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="46" font-weight="800" letter-spacing="-1">Admin Grocery Dashboard</text>
    <text x="0" y="130" fill="url(#cyanGrad)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Centralized Commerce Administration &amp; Oversight</text>

    <text x="0" y="185" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400">Executive administration console for regulating multi-store vendors, approving</text>
    <text x="0" y="215" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400">product catalogues, auditing regional deliveries, and analyzing platform revenue.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#F8FAFC" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Store Approvals</text>

      <rect x="175" y="0" width="160" height="40" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="255" y="25" fill="#F8FAFC" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Order Dispatch</text>

      <rect x="350" y="0" width="160" height="40" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="430" y="25" fill="#F8FAFC" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Sales Analytics</text>
    </g>
  </g>

  <!-- Right Visual: Admin KPIs and Multi-Store Table -->
  <g transform="translate(720, 140)">
    <rect x="0" y="0" width="410" height="390" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="45" rx="16" fill="#1E293B"/>
    <text x="25" y="28" fill="#F8FAFC" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">Platform Analytics · admingrocery.inwora.com</text>

    <!-- KPI Metric Cards -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="115" height="75" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="12" y="25" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600">STORES</text>
      <text x="12" y="52" fill="#38BDF8" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800">42</text>

      <rect x="128" y="0" width="115" height="75" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
      <text x="140" y="25" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600">ORDERS TODAY</text>
      <text x="140" y="52" fill="#10B981" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800">1,248</text>

      <rect x="256" y="0" width="115" height="75" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="268" y="25" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600">GMV VOLUME</text>
      <text x="268" y="52" fill="#818CF8" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800">₹3.8L</text>
    </g>

    <!-- Vendor Management Table Preview -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="370" height="210" rx="8" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
      <text x="15" y="25" fill="#F8FAFC" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700">VERIFIED GROCERY OUTLETS</text>

      <!-- Row 1 -->
      <g transform="translate(15, 38)">
        <rect x="0" y="0" width="340" height="38" rx="6" fill="#0F172A"/>
        <text x="12" y="24" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600">Reliance Fresh - Branch 04</text>
        <rect x="250" y="10" width="75" height="18" rx="4" fill="#10B981" fill-opacity="0.2"/>
        <text x="287" y="23" fill="#34D399" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACTIVE</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(15, 84)">
        <rect x="0" y="0" width="340" height="38" rx="6" fill="#0F172A"/>
        <text x="12" y="24" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600">Heritage Mart - City Center</text>
        <rect x="250" y="10" width="75" height="18" rx="4" fill="#10B981" fill-opacity="0.2"/>
        <text x="287" y="23" fill="#34D399" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACTIVE</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(15, 130)">
        <rect x="0" y="0" width="340" height="38" rx="6" fill="#0F172A"/>
        <text x="12" y="24" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600">Kovai Organic Stores</text>
        <rect x="250" y="10" width="75" height="18" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
        <text x="287" y="23" fill="#FBBF24" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" text-anchor="middle">PENDING QC</text>
      </g>
    </g>
  </g>
</svg>