<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="abnayaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#0F1E36"/>
      <stop offset="100%" stop-color="#060C17"/>
    </linearGradient>
    <linearGradient id="abnayaAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#228B22"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#abnayaBg)"/>

  <!-- Architectural grid lines -->
  <g stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.1" fill="none">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#2563EB" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="80" y="21" fill="#38BDF8" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">BUSINESS WEBSITE</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="54" font-weight="800" letter-spacing="-1">Sri Abnaya</text>
    <text x="0" y="130" fill="url(#abnayaAccent)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Professional Corporate &amp; Services Web Presence</text>

    <text x="0" y="185" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400">Structured business profile presenting core organizational capabilities,</text>
    <text x="0" y="215" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400">service offerings, and client touchpoints with clear visual hierarchy.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="170" height="40" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="85" y="25" fill="#F8FAFC" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Corporate Profile</text>

      <rect x="185" y="0" width="170" height="40" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="270" y="25" fill="#F8FAFC" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Service Portfolio</text>

      <rect x="370" y="0" width="170" height="40" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="455" y="25" fill="#F8FAFC" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Client Enquiries</text>
    </g>
  </g>

  <!-- Right Visual: Structured Modern Wireframe Cards -->
  <g transform="translate(740, 150)">
    <rect x="0" y="0" width="370" height="380" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))"/>
    <rect x="0" y="0" width="370" height="45" rx="16" fill="#1E293B"/>
    <circle cx="25" cy="22" r="5" fill="#EF4444"/>
    <circle cx="42" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="22" r="5" fill="#10B981"/>
    <text x="185" y="27" fill="#64748B" font-family="'Montserrat', sans-serif" font-size="11" text-anchor="middle">sriabnaya.aimstorm.in</text>

    <!-- Wireframe blocks -->
    <rect x="25" y="70" width="180" height="18" rx="4" fill="url(#abnayaAccent)" opacity="0.8"/>
    <rect x="25" y="100" width="320" height="10" rx="3" fill="#334155"/>
    <rect x="25" y="118" width="280" height="10" rx="3" fill="#334155"/>

    <!-- Service Cards preview -->
    <g transform="translate(25, 150)">
      <rect x="0" y="0" width="150" height="95" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="28" cy="28" r="14" fill="#2563EB" fill-opacity="0.3"/>
      <rect x="20" y="52" width="90" height="10" rx="2" fill="#E2E8F0"/>
      <rect x="20" y="68" width="110" height="7" rx="2" fill="#64748B"/>

      <rect x="170" y="0" width="150" height="95" rx="8" fill="#1E293B" stroke="#228B22" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="198" cy="28" r="14" fill="#228B22" fill-opacity="0.3"/>
      <rect x="190" y="52" width="90" height="10" rx="2" fill="#E2E8F0"/>
      <rect x="190" y="68" width="110" height="7" rx="2" fill="#64748B"/>
    </g>

    <!-- Bottom Action Ribbon -->
    <rect x="25" y="270" width="320" height="42" rx="8" fill="url(#emeraldBar)"/>
    <text x="185" y="296" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Connect With Sri Abnaya</text>
  </g>
</svg>