<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="subraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="50%" stop-color="#1C0A00"/>
      <stop offset="100%" stop-color="#0A0400"/>
    </linearGradient>
    <linearGradient id="templeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#subraBg)"/>

  <!-- Subtle Temple Gopuram Silhouette in Background -->
  <path d="M950 120 L965 140 L970 180 L980 230 L995 290 L1010 360 L890 360 L905 290 L920 230 L930 180 L935 140 Z" fill="#78350F" opacity="0.15"/>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#D97706" fill-opacity="0.2" stroke="url(#templeGold)" stroke-width="1" stroke-opacity="0.4"/>
    <text x="85" y="21" fill="#FDE68A" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">TEMPLE HOSPITALITY</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Subra Residency</text>
    <text x="0" y="130" fill="url(#templeGold)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Luxury Temple City Hospitality in Kumbakonam</text>

    <text x="0" y="185" fill="#FED7AA" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">Premier hotel destination in heritage Kumbakonam offering comfortable rooms,</text>
    <text x="0" y="215" fill="#FED7AA" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">family suites, temple travel proximity, and direct guest reservation services.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#1C0A00" stroke="#D97706" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#FFFBEB" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Deluxe Suites</text>

      <rect x="175" y="0" width="160" height="40" rx="8" fill="#1C0A00" stroke="#D97706" stroke-width="1" stroke-opacity="0.3"/>
      <text x="255" y="25" fill="#FFFBEB" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Temple Proximity</text>

      <rect x="350" y="0" width="170" height="40" rx="8" fill="#1C0A00" stroke="#D97706" stroke-width="1" stroke-opacity="0.3"/>
      <text x="435" y="25" fill="#FFFBEB" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Direct Reservation</text>
    </g>
  </g>

  <!-- Right Visual: Hotel Presentation Card -->
  <g transform="translate(750, 150)">
    <rect x="0" y="0" width="370" height="370" rx="16" fill="#1C0A00" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="370" height="45" rx="16" fill="#451A03"/>
    <text x="20" y="28" fill="#FFFBEB" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">subraresidency.com · Kumbakonam</text>

    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="330" height="130" rx="8" fill="#451A03" stroke="#B45309" stroke-width="1"/>
      <text x="20" y="35" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800">Deluxe Family Accommodation</text>
      <text x="20" y="60" fill="#FDE68A" font-family="'Montserrat', sans-serif" font-size="12">Air-Conditioned Suites · 24/7 Hot Water</text>
      <text x="20" y="85" fill="#FED7AA" font-family="'Montserrat', sans-serif" font-size="12">Walking Distance to Major Temples</text>
