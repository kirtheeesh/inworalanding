      <text x="80" y="113" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Book Your Stay</text>
    </g>

    <g transform="translate(20, 215)">
      <rect x="0" y="0" width="330" height="90" rx="8" fill="#2E1100" stroke="#78350F" stroke-width="1"/>
      <text x="15" y="30" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">Navagraha Tour Pilgrimage Desk</text>
      <text x="15" y="52" fill="#FED7AA" font-family="'Montserrat', sans-serif" font-size="11">Complete travel assistance for temple darshan</text>
      <text x="15" y="70" fill="#FED7AA" font-family="'Montserrat', sans-serif" font-size="11">and Kumbakonam heritage exploration</text>
    </g>

    <rect x="20" y="320" width="330" height="36" rx="6" fill="#D97706"/>
    <text x="185" y="343" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" text-anchor="middle">View Rooms &amp; Facilities</text>
  </g>
