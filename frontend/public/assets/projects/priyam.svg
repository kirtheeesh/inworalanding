<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="priyamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="50%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#270F03"/>
    </linearGradient>
    <linearGradient id="spiceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#priyamBg)"/>

  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#F59E0B" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1" stroke-opacity="0.4"/>
    <text x="90" y="21" fill="#FDE68A" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">AGRO FOODS BRAND</text>

    <text x="0" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Priyam Agro Foods</text>
    <text x="0" y="130" fill="url(#spiceGrad)" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600">Authentic South Indian Pastes, Thuvaiyals &amp; Relishes</text>

    <text x="0" y="185" fill="#FEF3C7" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">Official brand website for Madurai-based food manufacturer showcasing authentic</text>
    <text x="0" y="215" fill="#FEF3C7" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" opacity="0.9">natural pastes, traditional thokkus, millet sweets, and wholesale contact channels.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#451A03" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="25" fill="#FFFBEB" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">100% Natural</text>

      <rect x="175" y="0" width="160" height="40" rx="8" fill="#451A03" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3"/>
      <text x="255" y="25" fill="#FFFBEB" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Traditional Taste</text>

      <rect x="350" y="0" width="170" height="40" rx="8" fill="#451A03" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3"/>
      <text x="435" y="25" fill="#FFFBEB" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Wholesale Supply</text>
    </g>
  </g>

  <!-- Right Visual: Traditional South Indian Spice Jar Showcase -->
  <g transform="translate(750, 150)">
    <rect x="0" y="0" width="370" height="370" rx="16" fill="#270F03" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="370" height="45" rx="16" fill="#451A03"/>
    <text x="20" y="28" fill="#FEF3C7" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">priyam.inwora.com · Est. 2016 Madurai</text>

    <!-- Product 1 -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="330" height="75" rx="8" fill="#451A03" stroke="#B45309" stroke-width="1"/>
      <circle cx="38" cy="38" r="22" fill="#F59E0B" fill-opacity="0.3"/>
      <text x="75" y="32" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">Pirandai Thuvaiyal Paste</text>
      <text x="75" y="52" fill="#FDE68A" font-family="'Montserrat', sans-serif" font-size="11">Traditional Recipe · No Artificial Colours</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="330" height="75" rx="8" fill="#451A03" stroke="#B45309" stroke-width="1"/>
      <circle cx="38" cy="38" r="22" fill="#F59E0B" fill-opacity="0.3"/>
      <text x="75" y="32" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">Garlic &amp; Gongura Thokku</text>
      <text x="75" y="52" fill="#FDE68A" font-family="'Montserrat', sans-serif" font-size="11">Farm Fresh Spices · Ready-to-Eat</text>
    </g>

    <g transform="translate(20, 245)">
      <rect x="0" y="0" width="330" height="90" rx="8" fill="#D97706"/>
      <text x="165" y="35" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" text-anchor="middle">Priyam Agro Foods Heritage</text>
      <text x="165" y="60" fill="#FEF3C7" font-family="'Montserrat', sans-serif" font-size="12" text-anchor="middle">Pure Ingredients · Zero Preservatives</text>
    </g>
  </g>
</svg>