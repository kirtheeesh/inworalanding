kind = "web"
previewPath = "/"
title = "INWORA Landing Page"
version = "1.0.0"
id = "artifacts/inwora-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25011

[services.development]
run = "pnpm --filter @workspace/inwora-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inwora-landing", "run", "build" ]
publicDir = "artifacts/inwora-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25011"
BASE_PATH = "/"
